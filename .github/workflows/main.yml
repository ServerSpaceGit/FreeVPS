name: Test Self-Hosted Runner

on:
  push:
    branches: [ "main" ] # Замените на имя вашей ветки, если оно другое
  workflow_dispatch: # Позволит запустить тест вручную кнопкой на GitHub

jobs:
  test-job:
    runs-on: self-hosted # Это заставит задачу выполняться именно на вашей машине

    steps:
      - name: Check connection
        run: echo "Привет! Раннер работает отлично."

      - name: Show system info
        run: |
          echo "Имя хоста:" && hostname
          echo "Версия ОС:" && lsb_release -d
          echo "Текущий пользователь:" && whoami
